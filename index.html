
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEZKOR QO‘L</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <main class="container">

        <header>
            <div class="logo">⚡ TEZKOR QO‘L</div>
            <p class="subtitle">Reaksiyangni sinab ko‘r!</p>
        </header>

        <section class="stats">
            <div class="stat">
                <span>BALL</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>VAQT</span>
                <strong id="time">30</strong>
            </div>

            <div class="stat">
                <span>REKORD</span>
                <strong id="record">0</strong>
            </div>
        </section>

        <section class="game-card">

            <div class="game-info">
                <h2>🐱 Mushukni ushla!</h2>
                <p>Mushuk paydo bo‘lishi bilan tezda bos!</p>
            </div>

            <div id="gameArea" class="game-area">
                <div class="welcome">
                    <div class="welcome-icon">🐱</div>
                    <h3>Tayyor bo‘lsang boshlaymiz!</h3>
                    <p>Mushukni imkon qadar tez bos.</p>
                </div>
            </div>

            <button id="startBtn" class="start-btn">
                O‘YINNI BOSHLASH
            </button>

        </section>

        <div class="instruction">
            <span>⚡</span>
            <p>Har bir bosish — 1 ball. Tezroq harakat qil!</p>
        </div>

        <footer>
            AKRAMJONOVA JADRA MARATOVNA
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
